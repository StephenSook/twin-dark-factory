name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mandates:
    name: Mandates are built from source and generic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch the organizers' vocabulary list at the kickoff commit
        run: |
          git clone --quiet https://github.com/band-ai/dark-factory-wearedevs kickoff
          git -C kickoff checkout --quiet 803560d2a678ace1414465c098eb0ab5380ffade
      - name: Built mandates match their sources
        run: |
          python factory/tools/build_mandates.py
          git diff --exit-code -- factory/mandates
          test -z "$(git status --porcelain -- factory/mandates)"
      - name: No track vocabulary in any mandate
        run: python factory/tools/lint_mandates.py kickoff factory/mandates
      - name: Every runnable dispatch is generated and names exactly the seats
        run: python factory/tools/check_dispatch.py
      - name: The seat check and the generator catch planted disagreements
        run: sh factory/tools/test_check_dispatch.sh
      - name: Room-budget gates catch missing reports, cap overflow and stale summaries
        run: python factory/tools/test_room_budget.py
      - name: External room meter counts exact snapshots and fails closed
        run: python factory/tools/test_room_meter.py
      - name: Judged-room roster is exactly the configured seats
        run: python factory/tools/test_room_participants.py
      - name: Design-kit manifest detects missing, changed and extra files
        run: sh factory/tools/test_design_kit.sh
      - name: Seat runtimes cannot stay bound to an old room or repository
        run: python factory/tools/test_seat_runtime.py
      - name: Preflight requires fresh Claude headroom
        run: python factory/tools/test_usage_meter.py
      - name: Public claims cite distinct verbatim room evidence
        run: python factory/tools/test_claim_evidence.py
      - name: Every public text unit has a checked disposition
        run: python factory/tools/test_public_claims.py
      - name: Factory Floor copy matches the packaged six-seat result
        run: python factory/tools/test_factory_floor.py
      - name: Result packaging preserves every band-written stage byte
        run: python factory/tools/test_result_package.py

  guard:
    name: Commit guard and holdout seal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Workflow dependencies are immutable commit SHAs
        run: python3 factory/tools/test_workflow_pins.py
      - name: Result-repository commit guard refuses bad commits and accepts good ones
        run: sh factory/tools/test_pre_commit.sh
      - name: Holdout seal verifies, rejects tampering and refuses an empty folder
        run: sh factory/tools/test_seal_holdout.sh
      - name: Result verifier refuses a failed isolated harness process
        run: sh factory/tools/test_verify_result.sh
      - name: Demo wrapper preserves image argv and refuses spoofed rate keys
        run: python3 factory/tools/test_demo_runtime.py

  secrets:
    name: No secrets in full history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan every commit with gitleaks (checksum-verified release binary)
        env:
          V: "8.30.1"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          tarball="gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfL "${base}/gitleaks_${V}_checksums.txt" | grep " ${tarball}\$" | sha256sum -c -
          tar xzf "${tarball}" gitleaks
          ./gitleaks git . --redact --no-banner
